spymaster_task.2003.desc: "Mon [councillor.GetCouncilTitle|l] est inhabituellement forme[councillor.Custom('FR_LLle')] lorsqu’[councillor.GetSheHe] m’approche à la Cour : « [councillor_liege.Custom('FR_MonseigneurMadame')|U], vous êtes-vous déjà dit qu’agir dans l’ombre pourrait ne pas être le meilleur moyen d’obtenir ce que vous voulez ? ». C’est une déclaration surprenante, mais [councillor.GetSheHe] en vient finalement aux faits.\n\n« Il semble que... eh bien, tous les agents du complot [scheme.GetName] ont cessé de répondre à mes messages. C’est comme si rien ne s’était passé. »"
