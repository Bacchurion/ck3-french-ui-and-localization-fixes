 # Utilisation d'une nouvelle custom loc pour "la [CONFEDERATION]" car possiblement masculin (bloc de maison)
 # comme féminin (confédération)
 REALM_WINDOW_DIPLOMACY_TOOLTIP_CONFEDERATION: "#T Membre [CONFEDERATION.Custom('FR_DuDela_Confederation')][CONFEDERATION.GetName]#!\n"
 kick_from_house_bloc_interaction_desc: "Expulsez la [house|E] [recipient.Custom('FR_du_Char_U_Pi')][recipient.GetShortUIName] [actor.GetConfederation.Custom('FR_DuDela_Confederation')][actor.GetConfederation.GetName|Vl]"
 is_member_of_confederation_global: "Est membre [CONFEDERATION.Custom('FR_DuDela_Confederation')][CONFEDERATION.GetName]"
 not_is_member_of_confederation_global: "N’est pas membre [CONFEDERATION.Custom('FR_DuDela_Confederation')][CONFEDERATION.GetName]"
 is_member_of_confederation_first: "Vous êtes membre [CONFEDERATION.Custom('FR_DuDela_Confederation')][CONFEDERATION.GetName]"
 not_is_member_of_confederation_first: "Vous n’êtes pas membre [CONFEDERATION.Custom('FR_DuDela_Confederation')][CONFEDERATION.GetName]"
 is_member_of_confederation_third: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] membre [CONFEDERATION.Custom('FR_DuDela_Confederation')][CONFEDERATION.GetName]"
