 coronation_events.6150.c: "« [confederation.Custom('FR_LeLa_Confederation')|U][confederation.GetName] me contrarie... »"
 join_confederation_recipient_tt: "Rejoint [confederation.Custom('FR_LeLa_Confederation')][confederation.GetName]"
 recipient_joined_confederation_tt: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName|U] a rejoint [confederation.Custom('FR_LeLa_Confederation')][confederation.GetName]"
