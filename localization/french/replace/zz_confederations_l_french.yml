 mpo_interactions_events.0002.t: "[confederation.Custom('FR_LeLa_Confederation')|U][confederation.GetName]"
 mpo_interactions_events.0002.desc_joining: "Ainsi, je rejoins [confederation.Custom('FR_LeLa_Confederation')][confederation.GetName]. Mes promesses appartiennent à chacun de ses jeunes loups."
 msg_broken_confederation_desc_no_migrate_root: "Vous n’êtes plus un membre [confederation.Custom('FR_DuDela_Confederation')][confederation.GetName]"
 msg_joined_confederation_desc: "[joiner.Custom('FR_le_Char_U_P')|U][joiner.GetUIName] a rejoint [confederation.Custom('FR_LeLa_Confederation')][confederation.GetName]"
 mpo_interactions_events.0003.desc: "Je respecterai les traditions [confederation.Custom('FR_DuDela_Confederation')][confederation.GetName]. Notre union est notre force !\n\nL’épée qui s’approche de votre cou rencontrera ma lame. La flèche qui s’abat sur votre cœur ne sera pas plus rapide que mon bouclier."
 mpo_interactions_events.0030.desc: "Jurez d’honorer les coutumes [confederation.Custom('FR_DuDela_Confederation')][confederation.GetName]. Jurez de vous battre pour nous jusqu’à ce que votre corps se brise, jusqu’à ce que vos guerriers ne soient plus qu’os et cendres.\n\nPrêtez serment, et nous nous protégerons les uns les autres des maux de ce monde."
 joined_confederation_tt: "Vous avez rejoint [confederation.Custom('FR_LeLa_Confederation')][confederation.GetName]"
 mpo_decisions_events.0002.desc: "Les voix de [confederation.Custom('FR_LeLa_Confederation')][confederation.GetName] crient de peur au fur et à mesure que la nouvelle se répand : [ROOT.Char.Custom('FR_le_Char_Pi')][ROOT.Char.GetTitledFirstName] en a fini avec [confederation.Custom('FR_LuiElle_Confederation')] !\n\n"
 mpo_decisions_events.0003.desc_confederation_survives: "[confederation.Custom('FR_LeLa_Confederation')|U][confederation.GetName] est affaibli[confederation.Custom('FR_E_Confederation')], mais nous survivrons."
 leaver_left_confederation_tt: "[leaver.Custom('FR_le_Char_U_Pi')|U][leaver.GetShortUIName|U] a quitté [confederation.Custom('FR_LeLa_Confederation')][confederation.GetName]"
 tgp_japan_decision.9603.a.bloc: "[ROOT.Char.GetConfederation.Custom('FR_LeLa_Confederation')|U][ROOT.Char.GetConfederation.GetName] ne le tolérera pas."
 tgp_japan_decision.9603.a.tt: "Tous les membres [THIS.Char.GetConfederation.Custom('FR_DuDela_Confederation')][THIS.Char.GetConfederation.GetName|V] rejoindront la [war|El]"
 JAPAN_INSTALL_BLOC_MEMBER_WAR_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]Guerre d’expansion [ATTACKER.GetConfederation.Custom('FR_DuDela_Confederation')][ATTACKER.GetConfederation.GetName]"
 japan_install_bloc_member_cb_victory_desc: "[attacker.Custom('FR_le_Char_U_Pi')|U][attacker.GetShortUIName|U] saisira les [titles|El] contestés pour [attacker.GetConfederation.Custom('FR_LeLa_Confederation')][attacker.GetConfederation.GetName], et décidera comment les distribuer."
 japan_bloc_war_cb_victory_desc: "[defender.Custom('FR_le_Char_U_Pi')|U][defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer,'êtes','est')] forcé[defender.Custom('FR_E')] de reconnaître la supériorité [attacker.GetConfederation.Custom('FR_DuDela_Confederation')][attacker.GetConfederation.GetName]."
 japan_bloc_war_cb_white_peace_desc: "[defender.Custom('FR_le_Char_U_Pi')|U][defender.GetShortUIName|U] sauvera l’honneur [defender.GetConfederation.Custom('FR_DuDela_Confederation')][defender.GetConfederation.GetName]."
 japan_bloc_war_cb_defeat_desc: "[attacker.Custom('FR_le_Char_U_Pi')|U][attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer,'êtes','est')] forcé[attacker.Custom('FR_E')] de reconnaître la supériorité [defender.GetConfederation.Custom('FR_DuDela_Confederation')][defender.GetConfederation.GetName]."
 tgp_japan_general.8800.t: "[ROOT.Char.GetConfederation.Custom('FR_LeLa_Confederation')|U][ROOT.Char.GetConfederation.GetName] s’étend"
 tgp_japan_general.8800.desc: "Mes forces peuvent être fières de nous avoir bien servis, moi et [attacker.GetConfederation.Custom('FR_LeLa_Confederation')][attacker.GetConfederation.GetName], contre [war_loser.Custom('FR_le_Char_Pi')][war_loser.GetTitledFirstName]. [war_loser.Custom('FR_IlElle')|U] a perdu son titre – [target_title.GetName] – et c’est à moi de l’accorder.\n\nIl serait prudent de donner ces terres à un vassal digne de confiance et loyal, qui respecte ce que je dis et pourrait me rendre service à l’avenir."
 tgp_house_blocs.1001.desc: "La direction de la Maison [bloc_leader.GetHouse.GetBaseName] est toujours aussi déterminée et courageuse, et désormais, [bloc_leader.Custom('FR_le_Char_Pi')][bloc_leader.GetTitledFirstName] cherche à rallier notre opposition [defender.Custom('FR_au_Char_Pi')][defender.GetTitledFirstName].\n\nPersonne, qu’il soit pour ou contre [bloc_leader.GetConfederation.Custom('FR_LeLa_Confederation')][bloc_leader.GetConfederation.GetName], ne peut ignorer la puissance qui découle de notre unité. Peu de gens seraient surpris de trouver des guerriers de la Maison [ROOT.Char.GetHouse.GetBaseNameNoTooltip] parmi les rangs de l’armée [bloc_leader.GetHouse.GetBaseNameNoTooltip]."
 tgp_bloc_change_cohesion_bloc_war_victory_tt: "[winner.GetConfederation.Custom('FR_LeLa_Confederation')|U][winner.GetConfederation.GetName|V] a prouvé sa [supremacy|El] sur [icon.GetConfederation.Custom('FR_LeLa_Confederation')][icon.GetConfederation.GetName|V]"
 tgp_bloc_change_cohesion_bloc_war_defeat_tt: "[loser.GetConfederation.Custom('FR_LeLa_Confederation')|U][loser.GetConfederation.GetName|V] a été forcé[loser.GetConfederation.Custom('FR_E_Confederation')] d’accepter la [supremacy|El] [icon.GetConfederation.Custom('FR_DuDela_Confederation')][icon.GetConfederation.GetName|V]"
 invite_to_house_bloc_interaction_desc: "Demandez à la [house|E] [recipient.GetHouse.GetBaseName|V] de rejoindre [actor.GetConfederation.Custom('FR_LeLa_Confederation')][actor.GetConfederation.GetName|V]"
