l_french:
 # Fix uppercase WarGod
 pam_interactions_events.0070.a: "« [ROOT.Char.GetFaith.WarGodName|U] est à nos côtés ! #EMP Aux armes !#! »"

 # L'Chrétienté => la Chrétienté
 pam_the_christian_church.0052.desc.intro: "Un chœur de voix s’élève dans l’obscurité qui enveloppe la [GetSituation('the_christian_church').GetTopSubRegion.GetName].\n\n« #EMP Rome se présente comme une Sodome moderne !#! »\n\n« #EMP Le pape se fait à la fois proxénète et prostituée !#! »\n\nMême ceux qui ont un point de vue plutôt modéré doivent admettre que l’Église est en crise et que des réformes sont nécessaires."
 pam_the_christian_church.0053.desc.intro: "Nous devons nous réjouir des progrès remarquables de notre mission ! Les frontières de la [GetSituation('the_christian_church').GetTopSubRegion.GetName] s’étendent, car les sauvages païens apprennent à suivre la voie du Christ.\n\nMalheureusement, tous n’accueillent pas favorablement les enseignements de l’Église. Il n’y a rien à craindre, car s’ils rejettent nos missionnaires, ils découvriront nos prières par la pointe de l’épée !\n\n"
 pam_the_christian_church.0053.desc.eastern: "Même si Rome prétend ne vouloir que la conversion de ceux qui vivent en dehors de la [GetSituation('the_christian_church').GetTopSubRegion.GetName], nous devons rester vigilants au cas où elle nous priverait de notre rite [ROOT.Char.GetRite.GetAdherentName] – ou pire encore : brandirait ses épées encore maculées de sang païen contre ses frères chrétiens."
 pam_the_christian_church.0057.desc.intro.common: "Les conflits au sein de l’Église prennent fin. La [GetSituation('the_christian_church').GetTopSubRegion.GetName] entre dans une ère de paix et de communion"
  
 # du Papauté => de la Papauté
 pam_the_christian_church.0057.desc.intro.head: "$pam_the_christian_church.0057.desc.intro.common$ sous la supervision de la [christianity.GetReligiousHeadTitle.GetName].\n\n"

 # Reformulation pour la confession d'une liaison dans pam_decision_events.0006.desc.secret_sin ([my_secret.GetName|l] = "liaison")
 pam_decision_events.0006.desc.secret_sin: "J’ai dissimulé ma [my_secret.GetName|l] adultère dans un havre d’obscurité."

 # Uppercase
 pam_decision_events.0011.desc.permitted: "À partir de ce jour, l’estimable [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )|l] fera partie des enseignements reconnus de notre foi.\n\nQue ceux qui le pratiquaient en secret sortent de l’ombre."
 pam_decision_events.0011.desc.prohibited: "À partir de ce jour, l’immonde [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )|l] est cause d’anathème. Tous ceux qui s’y accrochent se séparent des fidèles."

 # Fix "m <prenom>" : court_chaplain => 
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n« De plus en plus de gens considèrent cela comme un élément fondamental de leur culte », me fait remarquer m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', SCOPE.sC('court_chaplain'))] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n« Interdire une pratique comporte des risques, mais dans ce cas précis, c’est tout à fait justifié », me rassure m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', SCOPE.sC('court_chaplain'))] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n« Cette pratique reste populaire. La condamner présente certains risques », s’inquiète m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', SCOPE.sC('court_chaplain'))] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_good: "\n\n« Cette pratique perd en popularité. C’est le bon moment pour arrêter de la soutenir », me conseille m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', SCOPE.sC('court_chaplain'))] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good: "\n\n« Cette pratique gagne en popularité. Il serait peut-être judicieux d’envisager de la soutenir », suggère m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', SCOPE.sC('court_chaplain'))] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n« Cette pratique est obscure. La soutenir pourrait être dangereux », m’avertit m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', SCOPE.sC('court_chaplain'))] [court_chaplain.GetFirstName]."
  
 # Fix occurences de friend -> prophet
 pam_secular_faith_events.0014.a: "[prophet.GetSheHe|U] est un[prophet.Custom('FR_E')] véritable [Select_CString(prophet.IsFemale,'prophétesse','prophète')]."

 # Uppercase WarGod
 great_holy_war.0053.a: "[the_faith.WarGodName|U] nous a abandonné !"
